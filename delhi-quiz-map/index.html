<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delhi Map - Interactive Points of Interest</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
        }

        #app {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        #sidebar {
            width: 340px;
            background: #16213e;
            border-right: 2px solid #0f3460;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: width 0.3s;
            z-index: 1000;
        }

        #sidebar.collapsed {
            width: 0;
            border-right: none;
        }

        #sidebar-header {
            padding: 16px;
            background: #0f3460;
            border-bottom: 2px solid #e94560;
        }

        #sidebar-header h1 {
            font-size: 1.3rem;
            color: #e94560;
            margin-bottom: 4px;
        }

        #sidebar-header p {
            font-size: 0.75rem;
            color: #8899aa;
        }

        #search-box {
            margin: 12px 16px;
            padding: 10px 14px;
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 0.9rem;
            outline: none;
            width: calc(100% - 32px);
        }

        #search-box:focus {
            border-color: #e94560;
        }

        #search-box::placeholder {
            color: #556677;
        }

        /* Category filters */
        #filters {
            padding: 0 16px 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .filter-btn {
            padding: 5px 10px;
            border: 1px solid #0f3460;
            border-radius: 16px;
            background: transparent;
            color: #8899aa;
            font-size: 0.72rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .filter-btn.active {
            background: var(--cat-color);
            color: #fff;
            border-color: var(--cat-color);
        }

        .filter-btn:hover {
            border-color: var(--cat-color);
            color: #fff;
        }

        /* POI list */
        #poi-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
        }

        #poi-list::-webkit-scrollbar { width: 6px; }
        #poi-list::-webkit-scrollbar-track { background: #16213e; }
        #poi-list::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }

        .poi-card {
            padding: 10px 12px;
            margin-bottom: 6px;
            background: #1a1a2e;
            border-radius: 8px;
            border-left: 3px solid var(--cat-color);
            cursor: pointer;
            transition: all 0.2s;
        }

        .poi-card:hover {
            background: #0f3460;
            transform: translateX(4px);
        }

        .poi-card h3 {
            font-size: 0.85rem;
            color: #fff;
            margin-bottom: 2px;
        }

        .poi-card .poi-cat {
            font-size: 0.68rem;
            color: var(--cat-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .poi-card .poi-area {
            font-size: 0.7rem;
            color: #667788;
        }

        #poi-count {
            padding: 8px 16px;
            font-size: 0.75rem;
            color: #556677;
            border-top: 1px solid #0f3460;
        }

        /* Map */
        #map-container {
            flex: 1;
            position: relative;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        #toggle-sidebar {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1001;
            background: #16213e;
            border: 2px solid #0f3460;
            color: #e94560;
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Area info panel */
        #area-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1001;
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 10px;
            padding: 12px 16px;
            min-width: 200px;
            max-width: 280px;
            display: none;
        }

        #area-panel h3 {
            color: #e94560;
            font-size: 0.95rem;
            margin-bottom: 6px;
        }

        #area-panel ul {
            list-style: none;
            padding: 0;
        }

        #area-panel li {
            font-size: 0.78rem;
            padding: 3px 0;
            color: #aabbcc;
            cursor: pointer;
        }

        #area-panel li:hover {
            color: #e94560;
        }

        /* Leaflet popup overrides */
        .leaflet-popup-content-wrapper {
            background: #16213e !important;
            color: #e0e0e0 !important;
            border-radius: 12px !important;
            border: 1px solid #0f3460 !important;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important;
            max-width: 360px !important;
        }

        .leaflet-popup-tip {
            background: #16213e !important;
            border: 1px solid #0f3460 !important;
        }

        .leaflet-popup-content {
            margin: 0 !important;
            padding: 0 !important;
            min-width: 280px;
        }

        .popup-content {
            padding: 0;
        }

        .popup-header {
            padding: 14px 16px 10px;
            border-bottom: 1px solid #0f3460;
        }

        .popup-header h3 {
            font-size: 1.05rem;
            color: #fff;
            margin-bottom: 4px;
        }

        .popup-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .popup-badge {
            font-size: 0.68rem;
            padding: 2px 8px;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .popup-body {
            padding: 12px 16px;
        }

        .popup-body p {
            font-size: 0.82rem;
            line-height: 1.5;
            color: #bcc;
            margin-bottom: 10px;
        }

        .popup-facts {
            background: #1a1a2e;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 10px;
        }

        .popup-facts h4 {
            font-size: 0.72rem;
            color: #e94560;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .popup-facts ul {
            list-style: none;
            padding: 0;
        }

        .popup-facts li {
            font-size: 0.78rem;
            padding: 3px 0;
            color: #99aabb;
            border-bottom: 1px solid #0f3460;
        }

        .popup-facts li:last-child {
            border-bottom: none;
        }

        .popup-facts li strong {
            color: #ddeeff;
        }

        .popup-footer {
            padding: 8px 16px 12px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .popup-tag {
            font-size: 0.65rem;
            padding: 2px 7px;
            background: #1a1a2e;
            border-radius: 8px;
            color: #778899;
            border: 1px solid #0f3460;
        }

        /* Marker cluster styles */
        .marker-cluster-small {
            background-color: rgba(233, 69, 96, 0.3) !important;
        }
        .marker-cluster-small div {
            background-color: rgba(233, 69, 96, 0.7) !important;
            color: #fff !important;
        }
        .marker-cluster-medium {
            background-color: rgba(15, 52, 96, 0.4) !important;
        }
        .marker-cluster-medium div {
            background-color: rgba(15, 52, 96, 0.8) !important;
            color: #fff !important;
        }

        /* Custom marker icons */
        .custom-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px !important;
            height: 32px !important;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .custom-marker span {
            transform: rotate(45deg);
            font-size: 14px;
        }

        /* Legend */
        .legend {
            background: #16213e !important;
            border: 1px solid #0f3460 !important;
            border-radius: 8px !important;
            padding: 10px 14px !important;
            color: #e0e0e0 !important;
            line-height: 1.8;
            font-size: 0.78rem;
        }

        .legend h4 {
            font-size: 0.82rem;
            margin-bottom: 4px;
            color: #e94560;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
    </style>
</head>
<body>

            <div id="sidebar-header">
                <h1>Delhi Map</h1>

        </div>
        <div id="map-container">

            <div id="map"></div>
            <div id="area-panel">

                <ul id="area-attractions"></ul>
            </div>
        </div>
    </div>

            description: "Siri Fort Sports Complex is a multi-sport facility built for the 1982 Asian Games. Located near the Siri Fort ruins, it includes badminton courts, swimming pool, and athletics track.",
            quizFacts: [
                "Built for the 1982 Asian Games",
                "Multi-sport facility with badminton, swimming, athletics",
                "Located near the historical Siri Fort ruins",
                "Regular venue for national-level tournaments",
                "Part of the Asian Games infrastructure legacy in Delhi"
            ],
            tags: ["sports", "asian games", "1982", "badminton", "swimming"]
        },
        {
            name: "RK Puram & Africa Avenue",
            lat: 28.5650, lng: 77.1800,
            category: "modern",
            area: "South Delhi",
            built: "1960s",
            builder: "CPWD / Government of India",
            description: "RK Puram (Ramakrishnapuram) is one of Delhi's largest government residential colonies. Africa Avenue (now Nelson Mandela Marg) connects it to the diplomatic enclave.",
            quizFacts: [
                "Named after Swami Ramakrishna Paramhansa",
                "One of Delhi's largest government housing colonies",
                "Divided into multiple sectors",
                "Africa Avenue renamed Nelson Mandela Marg",
                "Houses numerous government offices and schools",
                "Kendriya Vidyalaya schools here are among the oldest"
            ],
            tags: ["government", "residential", "colony", "RK puram"]
        },

        // ===== WATER BODIES & YAMUNA =====
        {
            name: "Yamuna River at Wazirabad Barrage",
            lat: 28.7210, lng: 77.2250,
            category: "park",
            area: "North Delhi",
            built: "1959 (barrage)",
            builder: "Government of Delhi",
            description: "Wazirabad Barrage is where Delhi draws most of its drinking water from the Yamuna. The river enters Delhi here, and downstream it becomes one of the most polluted stretches.",
            quizFacts: [
                "Delhi's primary water intake point from the Yamuna",
                "Built in 1959 to impound water for Delhi's supply",
                "Yamuna enters Delhi from Haryana here",
                "The river is relatively clean at this point",
                "Downstream from Wazirabad, the river becomes heavily polluted",
                "Only 2% of Yamuna's length (22 km through Delhi) accounts for 80% of pollution",
                "Historically important crossing point"
            ],
            tags: ["yamuna", "water", "barrage", "pollution", "drinking water"]
        },
        {
            name: "INA Market (Safdarjung)",
            lat: 28.5740, lng: 77.2070,
            category: "market",
            area: "South Delhi",
            built: "1950s",
            builder: "Government of India",
            description: "INA Market (Indian National Army Market) is one of Delhi's most unique markets, offering exotic meats, international food ingredients, and gourmet items. Named after Subhas Chandra Bose's Indian National Army.",
            quizFacts: [
                "Named after Subhas Chandra Bose's Indian National Army (INA)",
                "Known for exotic and international food items",
                "One of the few markets in Delhi selling exotic meats",
                "Has both indoor and outdoor sections",
                "Popular with diplomats, expats, and food enthusiasts",
                "Metro station (INA) on the Yellow Line",
                "Located near Dilli Haat and Safdarjung"
            ],
            tags: ["market", "food", "gourmet", "INA", "international"]
        },
        {
            name: "Bijay Mandal",
            lat: 28.5410, lng: 77.2170,
            category: "historical",
            area: "South Delhi",
            built: "1326–1327",
            builder: "Muhammad bin Tughluq",
            description: "Bijay Mandal (Tower of Victory) is believed to have been the audience hall or palace of Muhammad bin Tughluq in Jahanpanah, the fourth city of Delhi. Ibn Battuta described the sultan holding court in this structure.",
            quizFacts: [
                "Believed to be Muhammad bin Tughluq's palace/audience hall",
                "Part of Jahanpanah (fourth city of Delhi)",
                "Ibn Battuta, the Moroccan traveller, described this structure",
                "Name means 'Tower/Place of Victory'",
                "Has a thousand-pillared hall (hazar-sutun) underneath",
                "One of the key structures of Jahanpanah",
                "Located in Begumpur village, South Delhi"
            ],
            tags: ["sultanate", "tughluq", "ibn battuta", "jahanpanah", "palace"]
        },
        {
            name: "Begumpur Mosque",
            lat: 28.5390, lng: 77.2150,
            category: "religious",
            area: "South Delhi",
            built: "1340s",
            builder: "Muhammad bin Tughluq era",
            description: "Begumpur Mosque is one of the largest mosques built during the Tughluq period. Part of the Jahanpanah city, it can accommodate thousands of worshippers and features a massive courtyard.",
            quizFacts: [
                "One of the largest Tughluq-era mosques",
                "Part of Jahanpanah (fourth city of Delhi)",
                "Built during Muhammad bin Tughluq's reign",
                "Massive courtyard with cloistered walkways",
                "Multiple domes and tapering turrets",
                "Located in Begumpur village, South Delhi",
                "Relatively unknown despite its architectural significance"
            ],
            tags: ["sultanate", "mosque", "tughluq", "jahanpanah", "large"]
        },
        {
            name: "Khirki Masjid",
            lat: 28.5340, lng: 77.2200,
            category: "religious",
            area: "South Delhi",
            built: "1351",
            builder: "Khan-i-Jahan Junan Shah (PM of Firoz Shah Tughlaq)",
            description: "Khirki Masjid (Mosque of Windows) is a unique covered mosque with four open courtyards. The unusual design makes it partly covered, unlike most Indian mosques, with latticed windows (khirkis) allowing light in.",
            quizFacts: [
                "Name means 'Mosque of Windows' (khirki = window)",
                "Unique design: partially covered with four open courtyards",
                "Built by Khan-i-Jahan Junan Shah, PM of Firoz Shah Tughlaq",
                "Unlike typical Indian mosques which are open-air",
                "Latticed windows (jalis) allow light into the covered areas",
                "Located in Khirki village, South Delhi",
                "Part of the Jahanpanah/Sultanate architectural heritage"
            ],
            tags: ["sultanate", "mosque", "windows", "unique", "tughlaq"]
        }
    ];

    // ======== MAP INITIALIZATION ========
    const map = L.map('map', {
        center: [28.6139, 77.2090],
        zoom: 12,
        minZoom: 10,
        maxZoom: 18,
        zoomControl: false
    });

    L.control.zoom({ position: 'topright' }).addTo(map);

    // Dark tile layer
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 19
    }).addTo(map);

    // Marker cluster group
    const markers = L.markerClusterGroup({
        maxClusterRadius: 50,
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false,
        zoomToBoundsOnClick: true,
        iconCreateFunction: function(cluster) {
            const count = cluster.getChildCount();
            let size = 'small';
            if (count > 10) size = 'medium';
            if (count > 25) size = 'large';
            return L.divIcon({
                html: '<div><span>' + count + '</span></div>',
                className: 'marker-cluster marker-cluster-' + size,
                iconSize: L.point(40, 40)
            });
        }
    });

    // ======== CREATE MARKERS ========
    const allMarkers = [];
    let activeCategories = new Set(Object.keys(CATEGORIES));

    function createMarkerIcon(category) {
        const cat = CATEGORIES[category];
        return L.divIcon({
            className: 'custom-marker-wrapper',
            html: `<div class="custom-marker" style="background:${cat.color}"><span>${cat.icon}</span></div>`,
            iconSize: [32, 32],
            iconAnchor: [16, 32],
            popupAnchor: [0, -34]
        });
    }

    function createPopupContent(poi) {
        const cat = CATEGORIES[poi.category];
        let factsHtml = poi.quizFacts.map(f => `<li>${f}</li>`).join('');
        let tagsHtml = poi.tags.map(t => `<span class="popup-tag">${t}</span>`).join('');

        return `
            <div class="popup-content">
                <div class="popup-header">
                    <h3>${poi.name}</h3>
                    <div class="popup-meta">
                        <span class="popup-badge" style="background:${cat.color};color:#fff">${cat.icon} ${cat.label}</span>
                        <span class="popup-badge" style="background:#1a1a2e;color:#8899aa;border:1px solid #0f3460">${poi.area}</span>
                        ${poi.built ? `<span class="popup-badge" style="background:#1a1a2e;color:#8899aa;border:1px solid #0f3460">${poi.built}</span>` : ''}
                    </div>
                </div>
                <div class="popup-body">
                    <p>${poi.description}</p>
                    ${poi.builder ? `<p style="font-size:0.75rem;color:#778899;margin-bottom:8px"><strong>Built by:</strong> ${poi.builder}</p>` : ''}
                    <div class="popup-facts">
                        <h4>Quiz Facts</h4>
                        <ul>${factsHtml}</ul>
                    </div>
                </div>
                <div class="popup-footer">
                    ${tagsHtml}
                </div>
            </div>
        `;
    }

    POI_DATA.forEach(poi => {
        const marker = L.marker([poi.lat, poi.lng], {
            icon: createMarkerIcon(poi.category)
        });

        marker.bindPopup(createPopupContent(poi), {
            maxWidth: 360,
            maxHeight: 450,
            autoPan: true,
            className: 'dark-popup'
        });

        marker.on('mouseover', function() {
            this.openPopup();
        });

        marker.poiData = poi;
        allMarkers.push(marker);
        markers.addLayer(marker);
    });

    map.addLayer(markers);

    // ======== SIDEBAR: FILTERS ========
    const filtersContainer = document.getElementById('filters');

    // All filter button
    const allBtn = document.createElement('button');
    allBtn.className = 'filter-btn active';
    allBtn.textContent = 'All';
    allBtn.style.setProperty('--cat-color', '#e94560');
    allBtn.addEventListener('click', () => {
        activeCategories = new Set(Object.keys(CATEGORIES));
        updateFilters();
        filterMarkers();
    });
    filtersContainer.appendChild(allBtn);

    Object.entries(CATEGORIES).forEach(([key, cat]) => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn active';
        btn.textContent = `${cat.icon} ${cat.label}`;
        btn.style.setProperty('--cat-color', cat.color);
        btn.dataset.category = key;
        btn.addEventListener('click', () => {
            if (activeCategories.size === Object.keys(CATEGORIES).length) {
                activeCategories = new Set([key]);
            } else if (activeCategories.has(key) && activeCategories.size > 1) {
                activeCategories.delete(key);
            } else if (activeCategories.has(key) && activeCategories.size === 1) {
                activeCategories = new Set(Object.keys(CATEGORIES));
            } else {
                activeCategories.add(key);
            }
            updateFilters();
            filterMarkers();
        });
        filtersContainer.appendChild(btn);
    });

    function updateFilters() {
        const isAll = activeCategories.size === Object.keys(CATEGORIES).length;
        allBtn.classList.toggle('active', isAll);
        filtersContainer.querySelectorAll('.filter-btn[data-category]').forEach(btn => {
            btn.classList.toggle('active', activeCategories.has(btn.dataset.category));
        });
    }

    // ======== SIDEBAR: POI LIST ========
    const poiList = document.getElementById('poi-list');
    const poiCount = document.getElementById('poi-count');
    const searchBox = document.getElementById('search-box');

    function renderPoiList(filteredPois) {
        poiList.innerHTML = '';
        filteredPois.sort((a, b) => a.name.localeCompare(b.name)).forEach(poi => {
            const cat = CATEGORIES[poi.category];
            const card = document.createElement('div');
            card.className = 'poi-card';
            card.style.setProperty('--cat-color', cat.color);
            card.innerHTML = `
                <h3>${poi.name}</h3>
                <span class="poi-cat">${cat.icon} ${cat.label}</span>
                <span class="poi-area"> &bull; ${poi.area}</span>
            `;
            card.addEventListener('click', () => {
                map.setView([poi.lat, poi.lng], 16);
                const marker = allMarkers.find(m => m.poiData === poi);
                if (marker) {
                    markers.zoomToShowLayer(marker, () => {
                        marker.openPopup();
                    });
                }
            });
            poiList.appendChild(card);
        });
        poiCount.textContent = `Showing ${filteredPois.length} of ${POI_DATA.length} places`;
    }

    function filterMarkers() {
        const query = searchBox.value.toLowerCase().trim();
        markers.clearLayers();
        const filtered = [];

        allMarkers.forEach(marker => {
            const poi = marker.poiData;
            const matchesCategory = activeCategories.has(poi.category);
            const matchesSearch = !query ||
                poi.name.toLowerCase().includes(query) ||
                poi.area.toLowerCase().includes(query) ||
                poi.description.toLowerCase().includes(query) ||
                poi.tags.some(t => t.includes(query)) ||
                poi.quizFacts.some(f => f.toLowerCase().includes(query)) ||
                (poi.builder && poi.builder.toLowerCase().includes(query));

            if (matchesCategory && matchesSearch) {
                markers.addLayer(marker);
                filtered.push(poi);
            }
        });

        renderPoiList(filtered);
    }

    searchBox.addEventListener('input', filterMarkers);

    // Initial render
    filterMarkers();

    // ======== SIDEBAR TOGGLE ========
    document.getElementById('toggle-sidebar').addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('collapsed');
        setTimeout(() => map.invalidateSize(), 300);
    });

    // ======== AREA PANEL ON ZOOM ========
    const areaPanel = document.getElementById('area-panel');
    const areaName = document.getElementById('area-name');
    const areaAttractions = document.getElementById('area-attractions');

    const AREAS = {};
    POI_DATA.forEach(poi => {
        if (!AREAS[poi.area]) AREAS[poi.area] = [];
        AREAS[poi.area].push(poi);
    });

    map.on('moveend', () => {
        const zoom = map.getZoom();
        const bounds = map.getBounds();

        if (zoom >= 14) {
            const visiblePois = POI_DATA.filter(poi =>
                bounds.contains([poi.lat, poi.lng]) && activeCategories.has(poi.category)
            );

            if (visiblePois.length > 0) {
                const areaCounts = {};
                visiblePois.forEach(p => {
                    areaCounts[p.area] = (areaCounts[p.area] || 0) + 1;
                });
                const topArea = Object.entries(areaCounts).sort((a, b) => b[1] - a[1])[0][0];

                areaName.textContent = `${topArea} Area`;
                areaAttractions.innerHTML = '';
                visiblePois
                    .filter(p => p.area === topArea)
                    .forEach(poi => {
                        const li = document.createElement('li');
                        const cat = CATEGORIES[poi.category];
                        li.textContent = `${cat.icon} ${poi.name}`;
                        li.addEventListener('click', () => {
                            map.setView([poi.lat, poi.lng], 17);
                            const marker = allMarkers.find(m => m.poiData === poi);
                            if (marker) {
                                markers.zoomToShowLayer(marker, () => {
                                    marker.openPopup();
                                });
                            }
                        });
                        areaAttractions.appendChild(li);
                    });
                areaPanel.style.display = 'block';
            } else {
                areaPanel.style.display = 'none';
            }
        } else {
            areaPanel.style.display = 'none';
        }
    });

    // ======== LEGEND ========
    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = function() {
        const div = L.DomUtil.create('div', 'legend');
        div.innerHTML = '<h4>Categories</h4>';
        Object.entries(CATEGORIES).forEach(([key, cat]) => {
            div.innerHTML += `<div class="legend-item"><span class="legend-dot" style="background:${cat.color}"></span>${cat.icon} ${cat.label}</div>`;
        });
        return div;
    };
    legend.addTo(map);

    // ======== KEYBOARD SHORTCUT ========
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            map.closePopup();
        }
        if (e.key === '/' && document.activeElement !== searchBox) {
            e.preventDefault();
            searchBox.focus();
        }
    });
    </script>
</body>
</html>
